<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500&family=Playfair+Display:wght@600;700&family=Jost:wght@400;500;600&display=swap">

<style>
  :root{
    --purple-deep:#1a0e33;
    --purple-mid:#341c5e;
    --purple-glow:#7a4fc9;
    --gold:#cfa15d;
    --gold-bright:#ecd19a;
    --cream:#f5efe4;
    --crimson:#c0392b;
    --amber:#b8863c;
  }
  *{box-sizing:border-box;}
  #ft-app{
    position:relative;
    min-height:640px;
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(122,79,201,0.35), transparent 60%),
      radial-gradient(ellipse 700px 600px at 110% 110%, rgba(207,161,93,0.15), transparent 55%),
      linear-gradient(160deg, var(--purple-deep) 0%, var(--purple-mid) 55%, #241141 100%);
    font-family:'Jost', sans-serif;
    color:var(--cream);
    border-radius:18px;
    overflow:hidden;
    padding:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
  }
  .ft-shimmer{
    position:absolute; inset:0;
    background:linear-gradient(115deg, transparent 40%, rgba(207,161,93,0.06) 50%, transparent 60%);
    background-size:250% 250%;
    animation:shimmer 9s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes shimmer{
    0%{background-position:0% 0%;}
    50%{background-position:100% 100%;}
    100%{background-position:0% 0%;}
  }
  .ft-screen{
    position:relative;
    width:100%;
    max-width:440px;
    padding:44px 32px 36px;
    text-align:center;
    animation:fadeUp .5s ease both;
  }
  @keyframes fadeUp{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:none;} }

  .ft-monogram{
    font-family:'Playfair Display', serif;
    font-size:44px;
    font-weight:700;
    letter-spacing:2px;
    color:var(--gold-bright);
    line-height:1;
    margin-bottom:6px;
  }
  .ft-names{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-weight:500;
    font-size:19px;
    color:var(--gold);
    margin-bottom:28px;
    letter-spacing:0.5px;
  }
  .ft-eyebrow{
    font-size:11px;
    letter-spacing:3px;
    text-transform:uppercase;
    color:rgba(245,239,228,0.55);
    margin-bottom:10px;
  }
  .ft-title{
    font-family:'Playfair Display', serif;
    font-size:24px;
    font-weight:600;
    margin:0 0 26px;
    color:var(--cream);
  }

  .ft-input{
    width:100%;
    background:rgba(245,239,228,0.06);
    border:1px solid rgba(207,161,93,0.4);
    color:var(--cream);
    font-family:'Jost', sans-serif;
    font-size:20px;
    letter-spacing:3px;
    text-align:center;
    text-transform:uppercase;
    padding:16px 14px;
    border-radius:10px;
    outline:none;
    transition:border-color .2s, box-shadow .2s;
  }
  .ft-input::placeholder{ color:rgba(245,239,228,0.35); letter-spacing:2px; }
  .ft-input:focus{ border-color:var(--gold-bright); box-shadow:0 0 0 3px rgba(207,161,93,0.15); }

  .ft-btn{
    margin-top:16px;
    width:100%;
    background:linear-gradient(135deg, var(--gold) 0%, var(--gold-bright) 100%);
    color:#2a1a05;
    border:none;
    font-family:'Jost', sans-serif;
    font-weight:600;
    font-size:14px;
    letter-spacing:2px;
    text-transform:uppercase;
    padding:15px;
    border-radius:10px;
    cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .ft-btn:hover:not(:disabled){ transform:translateY(-1px); box-shadow:0 8px 20px rgba(207,161,93,0.3); }
  .ft-btn:disabled{ opacity:.6; cursor:default; }
  .ft-btn.ghost{
    background:transparent;
    border:1px solid rgba(207,161,93,0.5);
    color:var(--gold-bright);
    box-shadow:none;
  }

  .ft-error-msg{
    margin-top:12px; font-size:13px; color:#e6a89f; min-height:16px;
  }

  .ft-result-icon{
    width:74px; height:74px; margin:0 auto 18px;
  }
  .ft-result-title{
    font-family:'Playfair Display', serif;
    font-size:26px;
    font-weight:700;
    margin-bottom:8px;
  }
  .ft-result-sub{
    font-size:14px;
    color:rgba(245,239,228,0.75);
    margin-bottom:30px;
    line-height:1.5;
  }
  .ft-guest-name{ color:var(--gold-bright); font-weight:600; }

  .ft-footer-link{
    position:absolute; bottom:10px; right:14px;
    font-size:10px; letter-spacing:1px; color:rgba(245,239,228,0.25);
    text-decoration:none; cursor:pointer;
  }

  /* Admin */
  .ft-admin{ width:100%; max-width:560px; text-align:left; padding:30px 26px; }
  .ft-admin h2{ font-family:'Playfair Display', serif; color:var(--gold-bright); margin:0 0 4px; font-size:22px;}
  .ft-admin p.sub{ font-size:12px; color:rgba(245,239,228,0.5); margin:0 0 22px;}
  .ft-tabs{ display:flex; gap:8px; margin-bottom:18px; }
  .ft-tab{
    padding:8px 14px; font-size:12px; letter-spacing:1px; text-transform:uppercase;
    border:1px solid rgba(207,161,93,0.3); border-radius:20px; cursor:pointer; color:rgba(245,239,228,0.7);
  }
  .ft-tab.active{ background:var(--gold); color:#2a1a05; border-color:var(--gold); font-weight:600;}
  .ft-field-label{ font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:rgba(245,239,228,0.5); margin-bottom:6px; display:block;}
  textarea.ft-input{ text-transform:none; letter-spacing:0; text-align:left; font-size:14px; min-height:110px; resize:vertical; }
  input.ft-input.left{ text-transform:none; letter-spacing:0; text-align:left; font-size:15px; }

  .ft-stats{ display:flex; gap:10px; margin-bottom:18px; }
  .ft-stat{ flex:1; background:rgba(245,239,228,0.05); border:1px solid rgba(207,161,93,0.2); border-radius:10px; padding:12px; text-align:center;}
  .ft-stat .n{ font-family:'Playfair Display', serif; font-size:22px; color:var(--gold-bright);}
  .ft-stat .l{ font-size:10px; letter-spacing:1px; text-transform:uppercase; color:rgba(245,239,228,0.5); margin-top:2px;}

  .ft-list{ max-height:280px; overflow-y:auto; border:1px solid rgba(207,161,93,0.2); border-radius:10px; }
  .ft-row{ display:flex; justify-content:space-between; align-items:center; padding:10px 14px; font-size:13px; border-bottom:1px solid rgba(207,161,93,0.12);}
  .ft-row:last-child{ border-bottom:none; }
  .ft-row .code{ font-weight:600; letter-spacing:1px; color:var(--gold-bright);}
  .ft-row .name{ color:rgba(245,239,228,0.7); flex:1; margin-left:10px; }
  .ft-badge{ font-size:10px; padding:3px 9px; border-radius:20px; letter-spacing:0.5px; text-transform:uppercase; }
  .ft-badge.unused{ background:rgba(207,161,93,0.15); color:var(--gold-bright); border:1px solid rgba(207,161,93,0.4);}
  .ft-badge.used{ background:rgba(192,57,43,0.15); color:#e6a89f; border:1px solid rgba(192,57,43,0.4);}

  .ft-link-box{
    display:flex; gap:8px; background:rgba(245,239,228,0.05); border:1px solid rgba(207,161,93,0.25);
    border-radius:10px; padding:10px 12px; font-size:12px; margin-bottom:22px; word-break:break-all; align-items:center;
  }
  .ft-copy{ flex-shrink:0; background:none; border:1px solid var(--gold); color:var(--gold-bright); border-radius:6px; padding:5px 10px; font-size:11px; cursor:pointer;}

  .ft-loading{ font-size:13px; color:rgba(245,239,228,0.5); padding:30px 0; text-align:center;}
</style>

<div id="ft-app"><div class="ft-shimmer"></div></div>

<script>
(function(){
  const app = document.getElementById('ft-app');
  const ADMIN_PIN = "2026";
  let adminUnlocked = false;
  let activeTab = 'issue';

  function el(html){ const d=document.createElement('div'); d.innerHTML=html; return d.firstElementChild; }

  function render(node){
    app.innerHTML = '';
    const shimmer = document.createElement('div');
    shimmer.className='ft-shimmer';
    app.appendChild(shimmer);
    app.appendChild(node);
  }

  function ringSVG(color){
    return `<svg class="ft-result-icon" viewBox="0 0 100 100" fill="none">
      <circle cx="38" cy="55" r="20" stroke="${color}" stroke-width="4"/>
      <circle cx="62" cy="55" r="20" stroke="${color}" stroke-width="4"/>
    </svg>`;
  }

  // ---------- GUEST CHECK-IN VIEW ----------
  function renderCheckIn(){
    const wrap = el(`
      <div class="ft-screen">
        <div class="ft-monogram">FT</div>
        <div class="ft-names">Faithful &amp; Toluwanitemi</div>
        <div class="ft-eyebrow">Access Verification</div>
        <div class="ft-title">Enter Your Access Code</div>
        <input class="ft-input" id="ft-code-input" placeholder="e.g. FT-0142" autocomplete="off" maxlength="20" />
        <button class="ft-btn" id="ft-checkin-btn">Check In</button>
        <div class="ft-error-msg" id="ft-err"></div>
        <a class="ft-footer-link" id="ft-admin-link">admin</a>
      </div>
    `);
    render(wrap);

    const input = wrap.querySelector('#ft-code-input');
    const btn = wrap.querySelector('#ft-checkin-btn');
    const errEl = wrap.querySelector('#ft-err');
    input.focus();

    input.addEventListener('keydown', (e)=>{ if(e.key==='Enter') submit(); });
    btn.addEventListener('click', submit);
    wrap.querySelector('#ft-admin-link').addEventListener('click', ()=>{ location.hash='admin'; });

    async function submit(){
      const raw = input.value.trim().toUpperCase();
      if(!raw){ errEl.textContent = 'Please enter your code.'; return; }
      btn.disabled = true; btn.textContent='Checking...'; errEl.textContent='';
      try{
        const result = await checkInCode(raw);
        if(result.status === 'success') renderResult('success', result.data);
        else if(result.status === 'used') renderResult('used', result.data);
        else renderResult('invalid', null, raw);
      }catch(e){
        errEl.textContent = 'Something went wrong. Please try again.';
        btn.disabled=false; btn.textContent='Check In';
      }
    }
  }

  function renderResult(kind, data, rawCode){
    let icon, title, sub, color;
    if(kind==='success'){
      color = '#ecd19a';
      icon = ringSVG(color);
      title = 'Welcome!';
      sub = `<span class="ft-guest-name">${escapeHtml(data.guestName || 'Guest')}</span> — you're checked in.<br/>Admits ${data.admits || 1}. Enjoy the celebration.`;
    } else if(kind==='used'){
      color = '#e6a89f';
      icon = ringSVG(color);
      title = 'Already Used';
      const t = data.usedAt ? new Date(data.usedAt).toLocaleString() : '';
      sub = `This code was already checked in${t ? ' on '+t : ''}. Please see an usher if this seems wrong.`;
    } else {
      color = '#e6a89f';
      icon = ringSVG(color);
      title = 'Invalid Code';
      sub = `We couldn't find "${escapeHtml(rawCode||'')}". Double-check the code on your invitation and try again.`;
    }
    const wrap = el(`
      <div class="ft-screen">
        ${icon}
        <div class="ft-result-title" style="color:${kind==='success' ? '#ecd19a' : '#e6a89f'}">${title}</div>
        <div class="ft-result-sub">${sub}</div>
        <button class="ft-btn ghost" id="ft-back">Enter Another Code</button>
      </div>
    `);
    render(wrap);
    wrap.querySelector('#ft-back').addEventListener('click', renderCheckIn);
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ---------- STORAGE LOGIC ----------
  // All codes live in ONE record in Firebase Realtime Database.
  const FIREBASE_URL = 'https://ft-wedding-pass-default-rtdb.firebaseio.com';
  const DB_PATH = 'ft-codes-db';

  async function loadDB(){
    try{
      const res = await fetch(`${FIREBASE_URL}/${DB_PATH}.json`);
      const data = await res.json();
      if(data) return data;
    }catch(e){}
    return { counter: 0, codes: {} };
  }

  async function saveDB(db){
    await fetch(`${FIREBASE_URL}/${DB_PATH}.json`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(db)
    });
  }

  async function checkInCode(code){
    const db = await loadDB();
    const data = db.codes[code];
    if(!data) return { status:'invalid' };
    if(data.status === 'used') return { status:'used', data };
    data.status = 'used';
    data.usedAt = new Date().toISOString();
    await saveDB(db);
    return { status:'success', data };
  }

  async function issueCode(guestName, admits){
    const db = await loadDB();
    const n = db.counter + 1;
    const code = 'FT-' + String(n).padStart(4,'0');
    const record = { code, guestName, admits: admits || 1, status:'unused', usedAt:null, issuedAt:new Date().toISOString() };
    db.codes[code] = record;
    db.counter = n;
    await saveDB(db);
    return record;
  }

  async function listCodes(){
    const db = await loadDB();
    const records = Object.values(db.codes);
    records.sort((a,b)=> (a.code||'').localeCompare(b.code||''));
    return records;
  }

  async function bulkIssueCodes(names){
    const db = await loadDB();
    const created = [];
    names.forEach((name, i)=>{
      const n = db.counter + i + 1;
      const code = 'FT-' + String(n).padStart(4,'0');
      const record = { code, guestName:name, admits:1, status:'unused', usedAt:null, issuedAt:new Date().toISOString() };
      db.codes[code] = record;
      created.push(record);
    });
    db.counter += names.length;
    await saveDB(db);
    return created;
  }

  async function resetCode(code){
    const db = await loadDB();
    if(db.codes[code]){
      db.codes[code].status = 'unused';
      db.codes[code].usedAt = null;
      await saveDB(db);
    }
  }

  async function deleteCode(code){
    const db = await loadDB();
    delete db.codes[code];
    await saveDB(db);
  }

  async function clearAllCodes(){
    await saveDB({ counter: 0, codes: {} });
  }

  // ---------- ADMIN VIEW ----------
  function renderAdminGate(){
    const wrap = el(`
      <div class="ft-screen">
        <div class="ft-eyebrow">Restricted</div>
        <div class="ft-title">Admin Access</div>
        <input class="ft-input" id="ft-pin" type="password" placeholder="PIN" maxlength="10" />
        <button class="ft-btn" id="ft-pin-btn">Enter</button>
        <div class="ft-error-msg" id="ft-pin-err"></div>
        <a class="ft-footer-link" id="ft-back-guest">back</a>
      </div>
    `);
    render(wrap);
    const pinInput = wrap.querySelector('#ft-pin');
    pinInput.focus();
    const go = ()=>{
      if(pinInput.value === ADMIN_PIN){ adminUnlocked = true; renderAdmin(); }
      else wrap.querySelector('#ft-pin-err').textContent = 'Incorrect PIN.';
    };
    pinInput.addEventListener('keydown', e=>{ if(e.key==='Enter') go(); });
    wrap.querySelector('#ft-pin-btn').addEventListener('click', go);
    wrap.querySelector('#ft-back-guest').addEventListener('click', ()=>{ location.hash=''; });
  }

  async function renderAdmin(){
    const wrap = el(`
      <div class="ft-admin">
        <h2>Access Code Admin</h2>
        <p class="sub">Manage codes for Faithful &amp; Toluwanitemi's wedding</p>
        <div class="ft-link-box">
          <span id="ft-current-url">${location.href.split('#')[0]}</span>
          <button class="ft-copy" id="ft-copy-btn">Copy</button>
        </div>
        <div class="ft-tabs">
          <div class="ft-tab" data-tab="issue">Issue Codes</div>
          <div class="ft-tab" data-tab="list">Guest List</div>
        </div>
        <div id="ft-admin-body"><div class="ft-loading">Loading...</div></div>
        <a class="ft-footer-link" id="ft-back-guest2" style="position:static; display:inline-block; margin-top:18px;">&larr; back to check-in screen</a>
      </div>
    `);
    render(wrap);

    wrap.querySelector('#ft-copy-btn').addEventListener('click', ()=>{
      navigator.clipboard?.writeText(location.href.split('#')[0]);
      const b = wrap.querySelector('#ft-copy-btn'); b.textContent='Copied!'; setTimeout(()=>b.textContent='Copy',1500);
    });
    wrap.querySelector('#ft-back-guest2').addEventListener('click', ()=>{ location.hash=''; });

    wrap.querySelectorAll('.ft-tab').forEach(tab=>{
      tab.addEventListener('click', ()=>{ activeTab = tab.dataset.tab; renderAdminBody(wrap); });
    });

    renderAdminBody(wrap);
  }

  function renderAdminBody(wrap){
    wrap.querySelectorAll('.ft-tab').forEach(t=> t.classList.toggle('active', t.dataset.tab===activeTab));
    const body = wrap.querySelector('#ft-admin-body');
    if(activeTab === 'issue') renderIssueTab(body);
    else renderListTab(body);
  }

  function renderIssueTab(body){
    body.innerHTML = `
      <label class="ft-field-label">Add one guest</label>
      <input class="ft-input left" id="ft-single-name" placeholder="Guest or family name" style="margin-bottom:10px;" />
      <input class="ft-input left" id="ft-single-admits" type="number" min="1" value="1" placeholder="Admits" style="margin-bottom:10px;" />
      <button class="ft-btn" id="ft-single-add">Generate Code</button>
      <div class="ft-error-msg" id="ft-single-result"></div>

      <div style="height:24px;"></div>
      <label class="ft-field-label">Bulk add (one name per line)</label>
      <textarea class="ft-input" id="ft-bulk-names" placeholder="Mr &amp; Mrs Adebayo&#10;Chioma Okafor&#10;The Johnson Family"></textarea>
      <button class="ft-btn" id="ft-bulk-add" style="margin-top:10px;">Generate Codes for List</button>
      <div class="ft-error-msg" id="ft-bulk-result"></div>
    `;

    body.querySelector('#ft-single-add').addEventListener('click', async ()=>{
      const name = body.querySelector('#ft-single-name').value.trim();
      const admits = parseInt(body.querySelector('#ft-single-admits').value,10) || 1;
      const resultEl = body.querySelector('#ft-single-result');
      if(!name){ resultEl.textContent='Enter a guest name.'; resultEl.style.color='#e6a89f'; return; }
      const record = await issueCode(name, admits);
      resultEl.style.color = '#ecd19a';
      resultEl.textContent = `Code created: ${record.code} — share this with ${name}.`;
      body.querySelector('#ft-single-name').value='';
    });

    body.querySelector('#ft-bulk-add').addEventListener('click', async ()=>{
      const raw = body.querySelector('#ft-bulk-names').value;
      const names = raw.split('\n').map(s=>s.trim()).filter(Boolean);
      const resultEl = body.querySelector('#ft-bulk-result');
      if(!names.length){ resultEl.textContent='Add at least one name.'; resultEl.style.color='#e6a89f'; return; }
      resultEl.style.color = '#ecd19a';
      resultEl.textContent = `Generating ${names.length} codes...`;
      const created = await bulkIssueCodes(names);
      resultEl.innerHTML = `Created ${created.length} codes:<br/>` + created.map(r=>`${r.code} — ${r.guestName}`).join('<br/>');
      body.querySelector('#ft-bulk-names').value='';
    });
  }

  async function renderListTab(body){
    body.innerHTML = `<div class="ft-loading">Loading guest list...</div>`;
    const records = await listCodes();
    const used = records.filter(r=>r.status==='used').length;
    body.innerHTML = `
      <div class="ft-stats">
        <div class="ft-stat"><div class="n">${records.length}</div><div class="l">Issued</div></div>
        <div class="ft-stat"><div class="n">${used}</div><div class="l">Checked In</div></div>
        <div class="ft-stat"><div class="n">${records.length-used}</div><div class="l">Remaining</div></div>
      </div>
      <div class="ft-list" id="ft-list-body"></div>
      <button class="ft-btn ghost" id="ft-clear-all" style="margin-top:16px; border-color:rgba(192,57,43,0.5); color:#e6a89f;">Clear All Codes</button>
      <div class="ft-error-msg" id="ft-clear-msg"></div>
    `;
    body.querySelector('#ft-clear-all').addEventListener('click', async ()=>{
      const btn = body.querySelector('#ft-clear-all');
      const msg = body.querySelector('#ft-clear-msg');
      if(btn.dataset.confirming !== 'yes'){
        btn.dataset.confirming = 'yes';
        btn.textContent = 'Tap again to confirm — this deletes ALL codes';
        msg.textContent = '';
        setTimeout(()=>{ if(btn) { btn.dataset.confirming=''; btn.textContent='Clear All Codes'; } }, 4000);
        return;
      }
      btn.disabled = true; btn.textContent = 'Clearing...';
      await clearAllCodes();
      renderListTab(body);
    });
    const listBody = body.querySelector('#ft-list-body');
    if(!records.length){
      listBody.innerHTML = `<div class="ft-row"><span class="name">No codes issued yet.</span></div>`;
      return;
    }
    records.forEach(r=>{
      const row = el(`
        <div class="ft-row">
          <span class="code">${escapeHtml(r.code)}</span>
          <span class="name">${escapeHtml(r.guestName||'')}</span>
          <span class="ft-badge ${r.status}">${r.status}</span>
          ${r.status==='used' ? `<button class="ft-copy" data-code="${escapeHtml(r.code)}" style="margin-left:8px;">Reset</button>` : ''}
        </div>
      `);
      listBody.appendChild(row);
    });
    listBody.querySelectorAll('button[data-code]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        await resetCode(btn.dataset.code);
        renderListTab(body);
      });
    });
  }

  // ---------- ROUTER ----------
  function route(){
    if(location.hash === '#admin'){
      if(adminUnlocked) renderAdmin(); else renderAdminGate();
    } else {
      renderCheckIn();
    }
  }
  window.addEventListener('hashchange', route);
  route();
})();
</script>
